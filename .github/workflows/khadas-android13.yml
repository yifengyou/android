name: khadas android 13

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/khadas-android13.yml'
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  khadas-android13:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        id: basic_info
        run: |
          nproc
          uname -a
          cat /etc/*release
          free -h
          mount
          df -h
          cat /proc/cpuinfo
          cat /proc/meminfo

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -rf /swapfile /mnt/swapfile /usr/src/*
          sudo apt update
          sudo apt install -y ubuntu-minimal
          sudo apt-mark auto $(apt-mark showmanual | grep -v '^ubuntu-minimal$')
          sudo apt-get purge -y build-essential llvm-13 llvm-14 llvm-15 \
            gcc gcc-9 gcc-10 gcc-11 gcc-12 cpp cpp-9 cpp-10 cpp-11 cpp-12 \
            firefox clang-13 clang-14 clang-15
          sudo apt autoremove --purge -y
          sudo apt-get install -qq -y git gnupg \
            curl sudo rar coreutils zstd
          sudo apt clean
          lsblk
          df -Th

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          sudo mkdir -p /builder
          sudo chown -R runner:runner /builder
          lsblk
          df -Th
          git config --global user.name yifengyou
          git config --global user.email 842056007@qq.com

      - name: Repo sync
        working-directory: /builder
        id: clone
        run: |
          set -xe
          mkdir -p android13
          cd android13
          curl https://storage.googleapis.com/git-repo-downloads/repo > repo
          chmod a+x repo
          ls -alh repo
          ./repo init -u https://github.com/khadas/android_manifest.git -b khadas-edge2-android13
          ls -alh
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # only current-branch, 8job, only network, no-tags, no bundle
            .repo/repo/repo sync -c -j8 -n --no-tags --no-clone-bundle
            if [ $? -eq 0 ];then
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              ls -alh
              df -h
            fi
          done

      - name: Create archive with split
        working-directory: /builder
        id: archive
        run: |
          set -xe
          ls -alh /builder/*
          df -h
          du -sh android13
          tar -cf - --remove-files android13 | zstd -T0 -15 --long=31 | split -b 1G -d --verbose - khadas-android13_part_
          sync
          ls -alh /builder/*
          df -h

      - name: List created files
        working-directory: /builder
        run: |
          echo "Created archive files:"
          df -h
          ls -alh ./*

      - name: Upload to Release
        uses: ncipollo/release-action@main
        with:
          tag: khadas-android13
          artifacts: /builder/khadas-android*
          allowUpdates: true
          removeArtifacts: fase
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: | # khadas android13源码镜像

            ## 解压方法

            ```shell
              cat khadas-android* | zstd -d --long=31 -T0 | tar -xf -
            ```

            ## 免责声明
            - **按原样提供**：镜像不作任何保证，无任何担保，使用风险由用户自行承担
            - **无官方关联**：与主板厂商及瑞星微（Rockchip）无任何官方或商业关联
            - **安全建议**：请及时更新补丁、修改默认密码、配置防火墙
